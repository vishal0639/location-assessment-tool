server {
  listen 80;
  root /usr/share/nginx/html;

  # Re-resolve "api" via Docker's DNS instead of once at startup, so
  # recreating the api container doesn't leave nginx pointing at a dead IP.
  resolver 127.0.0.11 valid=10s;
  set $api_upstream http://api:8000;

  location /api/ {
    proxy_pass $api_upstream;
  }

  location / {
    try_files $uri /index.html;
  }
}
